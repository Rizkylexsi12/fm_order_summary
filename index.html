<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Order summary card</title>
</head>
<body class="bg-[url(images/pattern-background-desktop.svg)] bg-[#E0E8FF] bg-no-repeat bg-contain flex justify-center h-screen items-center">
  <div class="w-110 bg-white rounded-2xl">
    <div>
      <img src="images/illustration-hero.svg" class="rounded-t-2xl">
    </div>
    <div class="p-10">
      <div>
        <h2 class="text-center font-bold text-3xl mb-5">Order Summary</h2>
        <p class="text-center m-5 text-gray-500">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
      </div>
      <div class="flex bg-[#F8F9FE] p-5 rounded-lg justify-between items-center">
        <div class="flex gap-5 items-center">
          <img src="images/icon-music.svg">
          <div>
            <h4 class="font-bold">Annual Plan</h4>
            <h4 class="text-gray-500">$59.99/year</h4>
          </div>
        </div>
        <a class="underline text-[#443AAA] font-bold text-sm hover:text-[#766CF1] hover:no-underline cursor-pointer">Change</a>
      </div>
      <div class="flex flex-col items-center">
        <button class="mt-10 w-full py-3 bg-[#3829e0] text-white rounded-lg font-bold hover:bg-[#766CF1] cursor-pointer">
          Proceed to Payment
        </button>
        <span class="mt-5 text-center text-[#7280a7] font-bold hover:text-[#1f2f56] w-auto inline-block cursor-pointer">
          Cancel Order
        </span>
      </div>      
    </div>
  </div>
</body>
</html>
